# Generated by: Claude Opus 5.5
# Generation date: 2026-10-11
#
# Builds, smoke-tests and (outside test runs) publishes the ollama images.
# Gate kinds: test (non-main branch), edge (main), prerelease and release (tags).

name: ollama

on:
  push:
    branches: ['**']
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
    # Branch pushes only; GitHub ignores path filters for tag pushes
    paths:
      - Dockerfile.ollama
      - .github/scripts/smoke-test.sh
      - .github/workflows/ollama.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      ollama_version: ${{ steps.classify.outputs.ollama_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: classify
        name: Classify event
        run: |
          set -euo pipefail
          ollama_version=$(sed -n 's/^ARG OLLAMA_VERSION=//p' Dockerfile.ollama)
          [[ "$ollama_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Bad OLLAMA_VERSION in Dockerfile.ollama: '$ollama_version'"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # Strict semver (no leading zeros), digits only, alpha/beta prereleases
            n='(0|[1-9][0-9]*)'
            [[ "$GITHUB_REF_NAME" =~ ^$n\.$n\.$n(-(alpha|beta)\.$n)?$ ]] \
              || { echo "::error::Tag '$GITHUB_REF_NAME' is not X.Y.Z, X.Y.Z-alpha.N or X.Y.Z-beta.N"; exit 1; }
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then kind="prerelease"; else kind="release"; fi
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            kind="edge"
          else
            kind="test"
          fi
          echo "kind=$kind ollama_version=$ollama_version"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "ollama_version=$ollama_version" >> "$GITHUB_OUTPUT"

      - name: Release tag must be on main
        if: steps.classify.outputs.kind == 'release'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "::error::Release tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: CHANGELOG must have the release heading
        if: steps.classify.outputs.kind == 'release'
        run: |
          set -euo pipefail
          top=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' CHANGELOG.md || true)
          [[ "$top" == "## [$GITHUB_REF_NAME] - "* ]] \
            || { echo "::error::Newest CHANGELOG release heading is '$top', expected [$GITHUB_REF_NAME]"; exit 1; }

  build:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: base
            target: base
            ollama_model: ''
            model_digest: ''
            description: models from bind mount at /models
          - model: ministral-3-3b
            target: model
            ollama_model: ministral-3:3b-instruct-2512-q4_K_M
            model_digest: sha256:f04aa1c738f64e13c625b82ae92504fc0260fa6723b509ed1ece0fa188179b1d
            description: with Ministral 3 3B
          - model: gemma4-e4b
            target: model
            ollama_model: gemma4:e4b-it-q4_K_M
            model_digest: sha256:dc35e8d9c6061baa6f0fa870975ab6932e2542b579b13ea0f199fa4bb7300c9c
            description: with Gemma 4 E4B
    env:
      KIND: ${{ needs.gate.outputs.kind }}
      OLLAMA_VERSION: ${{ needs.gate.outputs.ollama_version }}
      SMOKE_TAG: local/ollama-${{ matrix.model }}:smoke
      DESCRIPTION: Ollama ${{ needs.gate.outputs.ollama_version }}, CPU-only, linux/amd64, ${{ matrix.description }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # docker driver: the image lands straight in the local daemon for the smoke test
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/jmtovar/local_llm_images/ollama-${{ matrix.model }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ env.KIND == 'release' || env.KIND == 'prerelease' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.KIND == 'release' }}
            type=semver,pattern={{major}},enable=${{ env.KIND == 'release' }}
            type=raw,value=latest,enable=${{ env.KIND == 'release' }}
            type=edge,branch=main,enable=${{ env.KIND == 'edge' }}
            type=sha,prefix=sha-,format=short,enable=${{ env.KIND == 'edge' }}
          labels: |
            org.opencontainers.image.title=ollama-${{ matrix.model }}
            org.opencontainers.image.description=${{ env.DESCRIPTION }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.ollama
          target: ${{ matrix.target }}
          platforms: linux/amd64
          build-args: |
            MODEL=${{ matrix.ollama_model }}
            MODEL_DIGEST=${{ matrix.model_digest }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.SMOKE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: false
          provenance: false
          sbom: false

      - name: Smoke test
        env:
          OLLAMA_MODEL: ${{ matrix.ollama_model }}
          MODEL_DIGEST: ${{ matrix.model_digest }}
        run: .github/scripts/smoke-test.sh "$SMOKE_TAG" "$OLLAMA_MODEL" "$MODEL_DIGEST"

      - name: Log in to GHCR
        if: env.KIND != 'test'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: env.KIND != 'test'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          [[ -n "$TAGS" ]] || { echo "::error::No tags to push for kind $KIND"; exit 1; }
          while read -r tag; do
            if [[ -n "$tag" ]]; then docker push "$tag"; fi
          done <<< "$TAGS"
