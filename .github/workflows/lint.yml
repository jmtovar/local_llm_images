name: lint

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

env:
  YAMLLINT_VERSION: 1.38.0
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned linters
        run: |
          set -euo pipefail
          pipx install "yamllint==${YAMLLINT_VERSION}"
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          # No upstream checksum file for ShellCheck; the hash was recorded on first download
          sc="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${sc}"
          echo "${SHELLCHECK_SHA256}  ${sc}" | sha256sum -c -
          tar -xzf "$sc" --strip-components=1 -C bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          al="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${al}"
          echo "${ACTIONLINT_SHA256}  ${al}" | sha256sum -c -
          tar -xzf "$al" -C bin actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: yamllint
        run: yamllint --strict .

      - name: shellcheck
        # -r: skip when the repo has no shell scripts yet
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

      - name: actionlint
        # Also runs shellcheck on every run: block (shellcheck is on PATH)
        run: actionlint -color
